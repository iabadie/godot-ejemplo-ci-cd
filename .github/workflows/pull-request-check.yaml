name: Aviso de nuevo PR

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened ]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    name: Aviso de PR por Discord
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Notificar éxito a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@master
        with:
          args: "**Nuevo PR:**\n**Título:** ${{ github.event.pull_request.title }}\n**Link:** ${{ github.event.pull_request.html_url }}"
