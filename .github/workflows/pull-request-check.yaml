name: Aviso de nuevo PR

on:
  pull_request:
    branches: [ "main" ]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    name: Aviso de PR por Discord
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Notificar éxito a Discord
        uses: Ilshadur/discord-webhook-notification@v1.2.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          severity: info
          text: |
            **Nuevo PR:**
            **Título:** ${{ github.event.pull_request.title }}
            **Link:** ${{ github.event.pull_request.html_url }}
