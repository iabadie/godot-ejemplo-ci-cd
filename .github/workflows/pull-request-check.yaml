name: Aviso de nuevo PR

on:
  pull_request:
    branches: [ "main" ]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    name: Aviso de PR por Discord
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Notificar éxito a Discord
        run: |
            curl -H "Content-Type: application/json" \
                -X POST \
                -d "{\"content\": \"**Nuevo PR:**\n**Título:** ${{ github.event.pull_request.title }}\n**Link:** ${{ github.event.pull_request.html_url }}" \
